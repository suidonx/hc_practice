<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鬼滅の刃 API Practice</title>
    <link rel="stylesheet" href="kimetsu_api.css" />
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>👹鬼滅の刃 API Practice</h1>
        <p>
          メニューにあるボタンをクリックすると鬼滅キャラクターが表示されます。
        </p>
      </header>
      <main>
        <h2>メニュー</h2>
        <div class="menu">
          <div class="menu-item">
            <input type="radio" id="all" name="kimetsu" checked />
            <label for="all">全キャラクター</label>
          </div>
          <div class="menu-item">
            <input type="radio" id="kisatsutai" name="kimetsu" />
            <label for="kisatsutai">鬼殺隊</label>
          </div>
          <div class="menu-item">
            <input type="radio" id="hashira" name="kimetsu" />
            <label for="hashira">柱</label>
          </div>
          <div class="menu-item">
            <input type="radio" id="oni" name="kimetsu" />
            <label for="oni">鬼</label>
          </div>
        </div>
        <div class="content">
          <table border="2">
            <tr>
              <th>名前</th>
              <th>画像</th>
              <th>カテゴリ</th>
            </tr>
          </table>
          <div id="loading" hidden>
            <div class="loading-text">Now Loading...</div>
          </div>
        </div>
      </main>
    </div>
    <script src="kimetsu_api.js"></script>
  </body>
</html>
